{% extends "base.html" %}
{% block content %}
<h2>All Chats</h2>
<ul>
    {% for chat in chats %}
        <li>
            <a href="{% url 'chat-page' chat.id %}">
                Chat {{ chat.id }} — 
                {% for p in chat.participants.all %}
                    {{ p.username }}{% if not forloop.last %}, {% endif %}
                {% endfor %}
            </a>
        </li>
    {% empty %}
        <li>No chats yet.</li>
    {% endfor %}
</ul>
{% endblock %}
