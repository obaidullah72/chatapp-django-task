{% extends "base.html" %}

{% block content %}
<div class="chat-container">
    <div class="chat-layout">
        <!-- Left column: chat list -->
        <div class="chat-sidebar">
            <h4 class="sidebar-title">Chats</h4>
            <ul id="chat-list" class="chat-list">
                {% for chat in chats %}
                    <li class="chat-list-item">
                        <a href="#" onclick="loadChat({{ chat.id }}, '{{ chat.participants.all|join:", "|escapejs }}'); return false;" 
                           class="chat-link">
                            {% for p in chat.participants.all %}
                                {{ p.username }}{% if not forloop.last %}, {% endif %}
                            {% endfor %}
                        </a>
                    </li>
                {% empty %}
                    <li class="no-chats">No chats yet</li>
                {% endfor %}
            </ul>
        </div>

        <!-- Right column: chat messages -->
        <div class="chat-main">
            <div class="chat-header">
                <h3 id="chat-title" class="font-semibold">Select a chat</h3>
            </div>
            <div id="chat-feed" class="messages-container">
                <div class="empty-state">
                    <p class="text-gray-500 text-lg">No messages yet</p>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    :root {
        --primary: #7c3aed;
        --primary-light: #8b5cf6;
        --secondary: #64748b;
        --light-bg: #f8fafc;
        --dark-bg: #0f172a;
        --message-bg: #f1f5f9;
        --message-user-bg: #DCF8C6; /* WhatsApp-like green for outgoing messages */
        --message-received-bg: #ffffff; /* White for incoming messages */
        --text-primary: #1e293b;
        --text-secondary: #64748b;
        --text-light: #94a3b8;
        --border-light: #e2e8f0;
        --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background-color: var(--light-bg);
        color: var(--text-primary);
        line-height: 1.5;
    }

    .chat-container {
        max-width: 1280px;
        margin: 0 auto;
        padding: 2rem;
        min-height: calc(100vh - 4rem); /* Adjust for navbar height */
    }

    .chat-layout {
        display: flex;
        gap: 1.5rem;
        height: 80vh;
        background: white;
        border-radius: 1rem;
        box-shadow: var(--shadow);
        overflow: hidden;
        border: 1px solid var(--border-light);
    }

    .chat-sidebar {
        width: 300px;
        background: var(--light-bg);
        border-right: 1px solid var(--border-light);
        display: flex;
        flex-direction: column;
    }

    .sidebar-title {
        font-size: 1.25rem;
        font-weight: 600;
        color: var(--text-primary);
        padding: 1.5rem;
        border-bottom: 1px solid var(--border-light);
        text-align: center;
    }

    .chat-list {
        list-style: none;
        flex: 1;
        overflow-y: auto;
        padding: 0;
    }

    .chat-list-item {
        border-bottom: 1px solid var(--border-light);
    }

    .chat-link {
        display: block;
        padding: 1rem 1.5rem;
        text-decoration: none;
        color: var(--text-primary);
        font-size: 0.95rem;
        transition: background 0.2s;
    }

    .chat-link:hover {
        background: var(--message-bg);
    }

    .no-chats {
        padding: 1rem;
        text-align: center;
        color: var(--text-secondary);
        font-size: 0.9rem;
    }

    .chat-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: var(--light-bg);
    }

    .chat-header {
        padding: 1.5rem 2rem;
        border-bottom: 1px solid var(--border-light);
        background: white;
        box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
    }

    .chat-header h3 {
        font-weight: 600;
        color: var(--text-primary);
    }

    .messages-container {
        flex: 1;
        padding: 1.5rem;
        overflow-y: auto;
        background: var(--message-bg);
        display: flex;
        flex-direction: column;
    }

    .empty-state {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .chat-bubble {
        max-width: 70%;
        padding: 0.75rem 1rem;
        margin-bottom: 1rem;
        border-radius: 0.75rem;
        display: flex;
        flex-direction: column;
        word-wrap: break-word;
        box-shadow: var(--shadow);
    }

    .chat-bubble.mine {
        background: var(--message-user-bg); /* Green for outgoing messages */
        color: var(--text-primary);
        align-self: flex-end;
        border-radius: 0.75rem 0.75rem 0 0.75rem; /* WhatsApp-like rounding */
    }

    .chat-bubble.theirs {
        background: var(--message-received-bg); /* White for incoming messages */
        color: var(--text-primary);
        align-self: flex-start;
        border-radius: 0.75rem 0.75rem 0.75rem 0; /* WhatsApp-like rounding */
    }

    .bubble-content .text {
        font-size: 0.9rem;
    }

    .bubble-content .timestamp {
        font-size: 0.65rem;
        color: var(--text-light);
        margin-top: 0.25rem;
        align-self: flex-end;
    }

    .chat-bubble.mine .timestamp {
        color: var(--text-secondary);
    }

    /* Navbar styling to match other pages */
    .navbar {
        background-color: var(--dark-bg);
        padding: 1rem;
        color: white;
        display: flex;
        align-items: center;
        gap: 1rem;
    }

    .navbar a, .navbar .logout-btn {
        color: white;
        text-decoration: none;
        font-size: 1rem;
        transition: color 0.2s;
    }

    .navbar a:hover, .navbar .logout-btn:hover {
        color: var(--primary-light);
        text-decoration: none;
    }

    .logout-btn {
        background: none;
        border: none;
        cursor: pointer;
        font: inherit;
    }
</style>

<script>
let ws = null;
let currentChatId = null;

// Load previous messages and connect WebSocket
function loadChat(chatId, chatName) {
    currentChatId = chatId;
    document.getElementById("chat-title").innerText = chatName;

    // Close previous WebSocket if exists
    if (ws) ws.close();

    // Connect new WebSocket (read-only)
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${protocol}//${window.location.host}/ws/chat/${chatId}/`);

    ws.onmessage = function(e) {
        const data = JSON.parse(e.data);
        const feed = document.getElementById("chat-feed");
        const newMsg = document.createElement("div");
        const isMine = data.user === "{{ user.username|escapejs }}";
        newMsg.className = "chat-bubble " + (isMine ? "mine" : "theirs");
        newMsg.innerHTML = `
            <div class="bubble-content">
                <span class="text">${data.message}</span>
                <span class="timestamp">${data.timestamp || ''}</span>
            </div>
        `;
        feed.appendChild(newMsg);
        feed.scrollTop = feed.scrollHeight; // Auto scroll
    };

    ws.onopen = function() {
        console.log("Connected to chat " + chatId);
    };

    ws.onclose = function() {
        console.log("Disconnected from chat " + chatId);
    };

    // Load previous messages via API
        fetch(`/chat/${chatId}/messages/`)
        .then(response => response.json())
        .then(data => {
            const feed = document.getElementById("chat-feed");
            feed.innerHTML = "";
            if (data.length === 0) {
                feed.innerHTML = `
                    <div class="empty-state">
                        <p class="text-gray-500 text-lg">No messages yet</p>
                    </div>`;
            } else {
                data.forEach(msg => {
                    const div = document.createElement("div");
                    const isMine = msg.sender__username === "{{ user.username|escapejs }}";
                    div.className = "chat-bubble " + (isMine ? "mine" : "theirs");
                    div.innerHTML = `
                        <div class="bubble-content">
                            <span class="text">${msg.content}</span>
                            <span class="timestamp">${msg.timestamp}</span>
                        </div>
                    `;
                    feed.appendChild(div);
                });
                feed.scrollTop = feed.scrollHeight;
            }
        });
}
</script>
{% endblock %}
