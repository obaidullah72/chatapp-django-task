{% extends "base.html" %}

{% block content %}
<div class="chat-container">
    <!-- Welcome Screen (visible when no chat is selected) -->
    <div id="welcome-screen" class="welcome-screen">
        <div class="welcome-content">
            <div class="welcome-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-10 h-10">
                    <path d="M4.913 2.658c2.075-.27 4.19-.408 6.337-.408 2.147 0 4.262.139 6.337.408 1.922.25 3.291 1.861 3.405 3.727a4.403 4.403 0 0 0-1.032-.211 50.89 50.89 0 0 0-8.42 0c-2.358.196-4.04 2.19-4.04 4.434v4.286a4.47 4.47 0 0 0 2.433 3.984L7.28 21.53A.75.75 0 0 1 6 21v-4.03a48.527 48.527 0 0 1-1.087-.128C2.905 16.58 1.5 14.833 1.5 12.862V6.638c0-1.97 1.405-3.718 3.413-3.979Z" />
                    <path d="M15.75 7.5c-1.376 0-2.739.057-4.086.169C10.124 7.797 9 9.103 9 10.609v4.285c0 1.507 1.128 2.814 2.67 2.94 1.243.102 2.5.157 3.768.165l2.782 2.781a.75.75 0 0 0 1.28-.53v-2.39l.33-.026c1.74-.13 3.02-1.587 3.02-3.314v-4.286c0-1.505-1.125-2.811-2.664-2.94A49.392 49.392 0 0 0 15.75 7.5Z" />
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-gray-900 mb-4">Welcome to ChatApp</h1>
            <p class="text-lg text-gray-600 mb-6">Select a conversation from the navigation bar to start chatting</p>
            <div class="welcome-features flex justify-center gap-6">
                <div class="feature flex flex-col items-center">
                    <span class="feature-icon text-2xl">🔒</span>
                    <span class="text-sm text-gray-600">Secure messaging</span>
                </div>
                <div class="feature flex flex-col items-center">
                    <span class="feature-icon text-2xl">🚀</span>
                    <span class="text-sm text-gray-600">Lightning fast</span>
                </div>
                <div class="feature flex flex-col items-center">
                    <span class="feature-icon text-2xl">💬</span>
                    <span class="text-sm text-gray-600">Real-time updates</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Chat messages area -->
    <div class="chat-main">
        <div class="chat-header">
            <h3 id="chat-title" class="text-xl font-semibold text-gray-800">Select a conversation</h3>
        </div>
        <div id="chat-messages" class="messages-container">
            <div class="empty-state">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-16 h-16 mb-4 text-gray-400">
                    <path d="M4.913 2.658c2.075-.27 4.19-.408 6.337-.408 2.147 0 4.262.139 6.337.408 1.922.25 3.291 1.861 3.405 3.727a4.403 4.403 0 0 0-1.032-.211 50.89 50.89 0 0 0-8.42 0c-2.358.196-4.04 2.19-4.04 4.434v4.286a4.47 4.47 0 0 0 2.433 3.984L7.28 21.53A.75.75 0 0 1 6 21v-4.03a48.527 48.527 0 0 1-1.087-.128C2.905 16.58 1.5 14.833 1.5 12.862V6.638c0-1.97 1.405-3.718 3.413-3.979Z" />
                </svg>
                <p class="text-gray-500 text-lg">Select a chat to view messages</p>
            </div>
        </div>
    </div>
</div>

<style>
    :root {
        --primary: #7c3aed;
        --primary-light: #8b5cf6;
        --secondary: #64748b;
        --light-bg: #f8fafc;
        --dark-bg: #0f172a;
        --message-bg: #f1f5f9;
        --message-user-bg: #7c3aed;
        --text-primary: #1e293b;
        --text-secondary: #64748b;
        --text-light: #94a3b8;
        --border-light: #e2e8f0;
        --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    .chat-container {
        max-width: 1280px;
        margin: 0 auto;
        padding: 2rem 2rem 2rem 2rem;
        min-height: calc(100vh - 4rem); /* Adjust for navbar height */
        display: flex;
        flex-direction: column;
    }

    .welcome-screen {
        display: flex;
        align-items: center;
        justify-content: center;
        position: absolute;
        top: 4rem; /* Offset for navbar */
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        z-index: 10;
    }

    .welcome-content {
        text-align: center;
        max-width: 600px;
        padding: 2rem;
    }

    .welcome-icon {
        width: 80px;
        height: 80px;
        margin: 0 auto 1.5rem;
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
    }

    .chat-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: var(--light-bg);
        border-radius: 1rem;
        box-shadow: var(--shadow);
        overflow: hidden;
    }

    .chat-header {
        padding: 1.5rem 2rem;
        border-bottom: 1px solid var(--border-light);
        background: white;
        box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
    }

    .chat-header h3 {
        font-weight: 600;
        text-align: center;
    }

    .messages-container {
        flex: 1;
        padding: 2rem;
        overflow-y: auto;
        background: var(--message-bg);
    }

    .empty-state {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: var(--text-light);
    }

    .message {
        margin-bottom: 1.5rem;
        max-width: 70%;
        padding: 1rem 1.5rem;
        border-radius: 1rem;
        box-shadow: var(--shadow);
    }

    .message-incoming {
        align-self: flex-start;
        background: white;
        border-radius: 1rem 1rem 1rem 0;
    }

    .message-outgoing {
        align-self: flex-end;
        background: var(--message-user-bg);
        color: white;
        border-radius: 1rem 1rem 0 1rem;
    }

    .message-sender {
        font-weight: 600;
        font-size: 0.875rem;
        margin-bottom: 0.25rem;
    }

    .message-outgoing .message-sender {
        color: rgba(255, 255, 255, 0.9);
    }

    .message-content {
        margin-bottom: 0.25rem;
    }

    .message-time {
        font-size: 0.75rem;
        text-align: right;
        opacity: 0.8;
    }

    .hidden {
        display: none;
    }

    /* Ensure navbar from base.html looks consistent */
    .navbar {
        background-color: var(--dark-bg);
        padding: 1rem;
        color: white;
        display: flex;
        align-items: center;
        gap: 1rem;
    }

    .navbar a, .navbar .logout-btn {
        color: white;
        text-decoration: none;
        font-size: 1rem;
        transition: color 0.2s;
    }

    .navbar a:hover, .navbar .logout-btn:hover {
        color: var(--primary-light);
        text-decoration: none;
    }

    .logout-btn {
        background: none;
        border: none;
        cursor: pointer;
        font: inherit;
    }
</style>

<script>
function loadChat(chatId, chatName) {
    // Hide welcome screen when a chat is selected
    document.getElementById("welcome-screen").classList.add("hidden");
    
    document.getElementById("chat-title").innerText = chatName;

    // Load previous messages via API
    fetch(`/chat/chat/${chatId}/messages/`)
        .then(response => response.json())
        .then(data => {
            const box = document.getElementById("chat-messages");
            box.innerHTML = "";
            
            if (data.length === 0) {
                box.innerHTML = `
                    <div class="empty-state">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-16 h-16 mb-4 text-gray-400">
                            <path d="M4.913 2.658c2.075-.27 4.19-.408 6.337-.408 2.147 0 4.262.139 6.337.408 1.922.25 3.291 1.861 3.405 3.727a4.403 4.403 0 0 0-1.032-.211 50.89 50.89 0 0 0-8.42 0c-2.358.196-4.04 2.19-4.04 4.434v4.286a4.47 4.47 0 0 0 2.433 3.984L7.28 21.53A.75.75 0 0 1 6 21v-4.03a48.527 48.527 0 0 1-1.087-.128C2.905 16.58 1.5 14.833 1.5 12.862V6.638c0-1.97 1.405-3.718 3.413-3.979Z" />
                        </svg>
                        <p class="text-gray-500 text-lg">No messages yet. Start the conversation!</p>
                    </div>
                `;
            } else {
                const messagesContainer = document.createElement("div");
                messagesContainer.style.display = "flex";
                messagesContainer.style.flexDirection = "column";
                
                data.forEach(msg => {
                    const messageDiv = document.createElement("div");
                    messageDiv.classList.add("message");
                    
                    // Determine if message is outgoing (based on current user)
                    const isOutgoing = msg.sender__username === "{{ request.user.username|escapejs }}";
                    
                    if (isOutgoing) {
                        messageDiv.classList.add("message-outgoing");
                    } else {
                        messageDiv.classList.add("message-incoming");
                    }
                    
                    messageDiv.innerHTML = `
                        <div class="message-sender">${msg.sender__username}</div>
                        <div class="message-content">${msg.content}</div>
                        <div class="message-time">${msg.timestamp}</div>
                    `;
                    
                    messagesContainer.appendChild(messageDiv);
                });
                
                box.appendChild(messagesContainer);
                box.scrollTop = box.scrollHeight;
            }
        });
}
</script>
{% endblock %}
