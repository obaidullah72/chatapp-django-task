{% extends "base.html" %}

{% block content %}
<div class="chat-container">
    <!-- Welcome Screen (visible when no chat is selected) -->
    <div id="welcome-screen" class="welcome-screen">
        <div class="welcome-overlay"></div>
        <div class="welcome-content">
            <div class="welcome-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-16 h-16">
                    <path d="M1.5 8.67v8.58a3 3 0 0 0 3 3h15a3 3 0 0 0 3-3V8.67l-8.928 5.493a3 3 0 0 1-3.144 0L1.5 8.67Z" />
                    <path d="M22.5 6.908V6.75a3 3 0 0 0-3-3h-15a3 3 0 0 0-3 3v.158l9.714 5.978a1.5 1.5 0 0 0 1.572 0L22.5 6.908Z" />
                </svg>
            </div>
            <div class="welcome-text">
                <h1 class="text-4xl font-extrabold text-gray-900 mb-4">Welcome to ChatApp</h1>
                <p class="text-xl text-gray-600 mb-8">Engage in real-time conversations. Select a chat to start.</p>
                <div class="welcome-features flex justify-start gap-8">
                    <div class="feature flex flex-col items-center">
                        <span class="feature-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-8 h-8 text-primary">
                                <path fill-rule="evenodd" d="M12 1.5a5.25 5.25 0 0 0-5.25 5.25v3a3 3 0 0 0-3 3v6.75a3 3 0 0 0 3 3h10.5a3 3 0 0 0 3-3v-6.75a3 3 0 0 0-3-3v-3c0-2.9-2.35-5.25-5.25-5.25Zm3.75 8.25v-3a3.75 3.75 0 1 0-7.5 0v3h7.5Z" clip-rule="evenodd" />
                            </svg>
                        </span>
                        <span class="text-base text-gray-700 font-semibold mt-2">Secure Messaging</span>
                    </div>
                    <div class="feature flex flex-col items-center">
                        <span class="feature-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-8 h-8 text-primary">
                                <path fill-rule="evenodd" d="M19.902 4.098a3.75 3.75 0 0 0-5.304 0l-4.5 4.5a3.75 3.75 0 0 0 1.035 6.037.75.75 0 0 1-.768 1.294 5.25 5.25 0 0 1-1.446-8.43l4.5-4.5a5.25 5.25 0 0 1 7.424 7.424l-1.757 1.757a.75.75 0 1 1-1.06-1.06l1.757-1.757a3.75 3.75 0 0 0 0-5.304Zm-7.389 4.5a.75.75 0 0 1 1.06 0l1.757 1.757a3.75 3.75 0 0 0 5.304 0 .75.75 0 0 1 1.06 0 5.25 5.25 0 0 1-7.424 7.424l-4.5-4.5a5.25 5.25 0 0 1 7.424-7.424l1.757 1.757a.75.75 0 1 1-1.06 1.06l-1.757-1.757a3.75 3.75 0 0 0-5.304 0Z" clip-rule="evenodd" />
                            </svg>
                        </span>
                        <span class="text-base text-gray-700 font-semibold mt-2">Lightning Fast</span>
                    </div>
                    <div class="feature flex flex-col items-center">
                        <span class="feature-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-8 h-8 text-primary">
                                <path d="M1.5 8.67v8.58a3 3 0 0 0 3 3h15a3 3 0 0 0 3-3V8.67l-8.928 5.493a3 3 0 0 1-3.144 0L1.5 8.67Z" />
                                <path d="M22.5 6.908V6.75a3 3 0 0 0-3-3h-15a3 3 0 0 0-3 3v.158l9.714 5.978a1.5 1.5 0 0 0 1.572 0L22.5 6.908Z" />
                            </svg>
                        </span>
                        <span class="text-base text-gray-700 font-semibold mt-2">Real-Time Updates</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Chat messages area -->
    <div id="chat-main" class="chat-main hidden">
        <div class="chat-header">
            <h3 id="chat-title" class="text-3xl font-semibold text-gray-800">Select a conversation</h3>
        </div>
        <div id="chat-messages" class="messages-container">
            <div class="empty-state">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-24 h-24 mb-6 text-gray-400">
                    <path d="M1.5 8.67v8.58a3 3 0 0 0 3 3h15a3 3 0 0 0 3-3V8.67l-8.928 5.493a3 3 0 0 1-3.144 0L1.5 8.67Z" />
                    <path d="M22.5 6.908V6.75a3 3 0 0 0-3-3h-15a3 3 0 0 0-3 3v.158l9.714 5.978a1.5 1.5 0 0 0 1.572 0L22.5 6.908Z" />
                </svg>
                <p class="text-gray-500 text-2xl">Select a chat to view messages</p>
            </div>
        </div>
    </div>
</div>

<style>
    :root {
        --primary: #1f4992;
        --primary-light: #345ca1;
        --secondary: #0284c7;
        --light-bg: #f8fafc;
        --dark-bg: #0f172a;
        --message-bg: #f1f5f9;
        --message-user-bg: #2656a8;
        --text-primary: #111827;
        --text-secondary: #4b5563;
        --text-light: #9ca3af;
        --border-light: #e5e7eb;
        --shadow: 0 10px 20px -4px rgba(0, 0, 0, 0.1), 0 4px 8px -2px rgba(0, 0, 0, 0.05);
    }

    body {
        margin: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .chat-container {
        width: 100%;
        min-height: calc(100vh - 4rem);
        margin-top: 4rem;
        padding: 0 1rem;
        display: flex;
        flex-direction: column;
        background: var(--light-bg);
        position: relative;
    }

    .welcome-screen {
        display: flex;
        align-items: center;
        justify-content: center;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: url("https://images.unsplash.com/photo-1508780709619-79562169bc64?auto=format&fit=crop&w=1400&q=80") no-repeat center center;
        background-size: cover;
        z-index: 10;
        transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .welcome-screen.hidden {
        opacity: 0;
        visibility: hidden;
    }

    .welcome-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.4);
        z-index: 1;
    }

    .welcome-content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: row;
        align-items: center;
        max-width: 1000px;
        padding: 2rem;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 1.5rem;
        box-shadow: var(--shadow);
        animation: fadeIn 0.7s ease-in-out;
    }

    .welcome-icon {
        width: 100px;
        height: 100px;
        margin-right: 2rem;
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .welcome-icon:hover {
        transform: scale(1.1);
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.25);
    }

    .welcome-text {
        flex: 1;
        text-align: left;
    }

    .welcome-features {
        gap: 2rem;
        justify-content: flex-start;
    }

    .feature {
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .feature:hover {
        transform: translateY(-6px);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
    }

    .feature-icon {
        width: 48px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, var(--secondary) 0%, var(--primary-light) 100%);
        border-radius: 50%;
        margin-bottom: 0.75rem;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        transition: transform 0.3s ease;
    }

    .feature-icon:hover {
        transform: scale(1.1);
    }

    .chat-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: white;
        overflow: hidden;
    }

    .chat-main.hidden {
        display: none;
    }

    .chat-header {
        padding: 2rem;
        border-bottom: 1px solid var(--border-light);
        background: linear-gradient(to bottom, white, var(--light-bg));
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .chat-header h3 {
        font-weight: 700;
        text-align: center;
        color: var(--text-primary);
    }

    .messages-container {
        flex: 1;
        padding: 2rem;
        overflow-y: auto;
        background: var(--message-bg);
    }

    .empty-state {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: var(--text-light);
        animation: fadeIn 0.5s ease-in-out;
    }

    .message {
        margin-bottom: 1.5rem;
        max-width: 80%;
        padding: 1rem 1.5rem;
        border-radius: 1.2rem;
        box-shadow: var(--shadow);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .message:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
    }

    .message-incoming {
        align-self: flex-start;
        background: white;
        border-radius: 1.2rem 1.2rem 1.2rem 0.4rem;
    }

    .message-outgoing {
        align-self: flex-end;
        background: var(--message-user-bg);
        color: white;
        border-radius: 1.2rem 1.2rem 0.4rem 1.2rem;
    }

    .message-sender {
        font-weight: 600;
        font-size: 0.9rem;
        margin-bottom: 0.4rem;
    }

    .message-outgoing .message-sender {
        color: rgba(255, 255, 255, 0.9);
    }

    .message-content {
        margin-bottom: 0.4rem;
        line-height: 1.5;
    }

    .message-time {
        font-size: 0.8rem;
        text-align: right;
        opacity: 0.8;
    }

    .navbar {
        background-color: var(--dark-bg);
        padding: 1rem;
        color: white;
        display: flex;
        align-items: center;
        gap: 1rem;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 4rem;
        z-index: 1000;
    }

    .navbar a, .navbar .logout-btn {
        color: white;
        text-decoration: none;
        font-size: 1rem;
        font-weight: 500;
        transition: color 0.2s ease, transform 0.2s ease;
    }

    .navbar a:hover, .navbar .logout-btn:hover {
        color: var(--primary-light);
        transform: translateY(-2px);
    }

    .logout-btn {
        background: none;
        border: none;
        cursor: pointer;
        font: inherit;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
        .chat-container {
            margin-top: 3.5rem;
            min-height: calc(100vh - 3.5rem);
            padding: 0 0.5rem;
        }

        .welcome-content {
            flex-direction: column;
            align-items: center;
            padding: 1.5rem;
            max-width: 90%;
        }

        .welcome-icon {
            width: 80px;
            height: 80px;
            margin-right: 0;
            margin-bottom: 1.5rem;
        }

        .welcome-text {
            text-align: center;
        }

        .welcome-features {
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .feature-icon {
            width: 40px;
            height: 40px;
        }

        h1.text-4xl {
            font-size: 2rem;
        }

        p.text-xl {
            font-size: 1rem;
        }

        .chat-header {
            padding: 1.5rem;
        }

        .messages-container {
            padding: 1.5rem;
        }

        .navbar {
            height: 3.5rem;
            padding: 0.75rem;
        }
    }

    @media (max-width: 480px) {
        .welcome-content {
            padding: 1rem;
        }

        .welcome-icon {
            width: 60px;
            height: 60px;
        }

        h1.text-4xl {
            font-size: 1.5rem;
        }

        p.text-xl {
            font-size: 0.9rem;
        }

        .feature-icon {
            width: 36px;
            height: 36px;
        }
    }
</style>

<script>
function loadChat(chatId, chatName) {
    // Hide welcome screen and show chat-main
    const welcomeScreen = document.getElementById("welcome-screen");
    const chatMain = document.getElementById("chat-main");
    welcomeScreen.classList.add("hidden");
    chatMain.classList.remove("hidden");
    
    document.getElementById("chat-title").innerText = chatName;

    // Load previous messages via API
    fetch(`/chat/chat/${chatId}/messages/`)
        .then(response => response.json())
        .then(data => {
            const box = document.getElementById("chat-messages");
            box.innerHTML = "";
            
            if (data.length === 0) {
                box.innerHTML = `
                    <div class="empty-state">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-20 h-20 mb-6 text-gray-400">
                            <path d="M1.5 8.67v8.58a3 3 0 0 0 3 3h15a3 3 0 0 0 3-3V8.67l-8.928 5.493a3 3 0 0 1-3.144 0L1.5 8.67Z" />
                            <path d="M22.5 6.908V6.75a3 3 0 0 0-3-3h-15a3 3 0 0 0-3 3v.158l9.714 5.978a1.5 1.5 0 0 0 1.572 0L22.5 6.908Z" />
                        </svg>
                        <p class="text-gray-500 text-xl">No messages yet. Start the conversation!</p>
                    </div>
                `;
            } else {
                const messagesContainer = document.createElement("div");
                messagesContainer.style.display = "flex";
                messagesContainer.style.flexDirection = "column";
                
                data.forEach(msg => {
                    const messageDiv = document.createElement("div");
                    messageDiv.classList.add("message");
                    
                    // Determine if message is outgoing (based on current user)
                    const isOutgoing = msg.sender__username === "{{ request.user.username|escapejs }}";
                    
                    if (isOutgoing) {
                        messageDiv.classList.add("message-outgoing");
                    } else {
                        messageDiv.classList.add("message-incoming");
                    }
                    
                    messageDiv.innerHTML = `
                        <div class="message-sender">${msg.sender__username}</div>
                        <div class="message-content">${msg.content}</div>
                        <div class="message-time">${msg.timestamp}</div>
                    `;
                    
                    messagesContainer.appendChild(messageDiv);
                });
                
                box.appendChild(messagesContainer);
                box.scrollTop = box.scrollHeight;
            }
        })
        .catch(error => {
            console.error('Error loading messages:', error);
            const box = document.getElementById("chat-messages");
            box.innerHTML = `
                <div class="empty-state">
                    <p class="text-red-500 text-xl">Error loading messages. Please try again.</p>
                </div>
            `;
        });
}
</script>
{% endblock %}
