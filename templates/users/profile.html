{% extends "base.html" %}

{% block content %}
<div class="profile-container">
    <div class="profile-card">
        <h2 class="profile-title">My Profile</h2>
        <div class="profile-content">
            {% if user.profile_pic %}
                <img src="{{ user.profile_pic.url }}" alt="Profile Picture" class="profile-pic">
            {% endif %}
            <div class="profile-info">
                <p><strong class="label">Username:</strong> {{ user.username }}</p>
                <p><strong class="label">Email:</strong> {{ user.email }}</p>
                <p><strong class="label">Bio:</strong> {{ user.bio|default:"No bio provided" }}</p>
            </div>
        </div>
    </div>
</div>

<style>
    :root {
        --primary: #7c3aed;
        --primary-light: #8b5cf6;
        --secondary: #64748b;
        --light-bg: #f8fafc;
        --dark-bg: #0f172a;
        --text-primary: #1e293b;
        --text-secondary: #64748b;
        --text-light: #94a3b8;
        --border-light: #e2e8f0;
        --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background-color: var(--light-bg);
        color: var(--text-primary);
        line-height: 1.5;
    }

    .profile-container {
        max-width: 1280px;
        margin: 0 auto;
        padding: 2rem;
        min-height: calc(100vh - 4rem); /* Adjust for navbar height */
        display: flex;
        justify-content: center;
        align-items: flex-start;
    }

    .profile-card {
        background: white;
        border-radius: 1rem;
        box-shadow: var(--shadow);
        padding: 2rem;
        width: 100%;
        max-width: 600px;
        border: 1px solid var(--border-light);
    }

    .profile-title {
        font-size: 2rem;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 1.5rem;
        text-align: center;
    }

    .profile-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
    }

    .profile-pic {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid var(--primary);
        box-shadow: var(--shadow);
    }

    .profile-info {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }

    .profile-info p {
        font-size: 1.1rem;
        color: var(--text-primary);
        margin: 0;
    }

    .label {
        color: var(--secondary);
        font-weight: 600;
        margin-right: 0.5rem;
    }

    /* Navbar styling to match home.html */
    .navbar {
        background-color: var(--dark-bg);
        padding: 1rem;
        color: white;
        display: flex;
        align-items: center;
        gap: 1rem;
    }

    .navbar a, .navbar .logout-btn {
        color: white;
        text-decoration: none;
        font-size: 1rem;
        transition: color 0.2s;
    }

    .navbar a:hover, .navbar .logout-btn:hover {
        color: var(--primary-light);
        text-decoration: none;
    }

    .logout-btn {
        background: none;
        border: none;
        cursor: pointer;
        font: inherit;
    }
</style>
{% endblock %}
