{% extends "base.html" %}

{% block content %}
<div class="chat-container">
    <div class="chat-layout">
        <!-- User List -->
        <div class="user-sidebar">
            <h4 class="sidebar-title">Users</h4>
            <ul id="user-list" class="user-list">
                {% for u in users %}
                    <li class="user-list-item" onclick="startChat({{ u.id }}, '{{ u.username|escapejs }}')">
                        {{ u.username }}
                        {% if u.is_online %}
                            <span style="color: green; font-size: 0.8rem;">● Online</span>
                        {% else %}
                            <span style="color: gray; font-size: 0.8rem;">● Offline</span>
                        {% endif %}
                    </li>
                {% empty %}
                    <li class="no-users">No users available</li>
                {% endfor %}
            </ul>
        </div>

        <!-- Chat Area -->
        <div id="chat-area" class="chat-main hidden">
            <div class="chat-header">
                <h3>Chat with <span id="chat-username" class="font-semibold"></span></h3>
            </div>
            <div id="chat-messages" class="messages-container">
                <div class="empty-state">
                    <p class="text-gray-500 text-lg">Select a user to load messages...</p>
                </div>
            </div>
            <form id="chat-form" class="chat-form">
                <input type="text" id="message-input" placeholder="Type a message..." class="message-input">
                <button type="submit" class="send-button">Send</button>
            </form>
        </div>
    </div>
</div>

<style>
    :root {
        --primary: #7c3aed;
        --primary-light: #8b5cf6;
        --secondary: #64748b;
        --light-bg: #f8fafc;
        --dark-bg: #0f172a;
        --message-bg: #f1f5f9;
        --message-user-bg: #DCF8C6; /* WhatsApp-like green for outgoing messages */
        --message-received-bg: #ffffff; /* White for incoming messages */
        --text-primary: #1e293b;
        --text-secondary: #64748b;
        --text-light: #94a3b8;
        --border-light: #e2e8f0;
        --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background-color: var(--light-bg);
        color: var(--text-primary);
        line-height: 1.5;
    }

    .chat-container {
        max-width: 1280px;
        margin: 0 auto;
        padding: 2rem;
        min-height: calc(100vh - 4rem);
    }

    .chat-layout {
        display: flex;
        gap: 1.5rem;
        height: 80vh;
        background: white;
        border-radius: 1rem;
        box-shadow: var(--shadow);
        overflow: hidden;
        border: 1px solid var(--border-light);
    }

    .user-sidebar {
        width: 250px;
        background: var(--light-bg);
        border-right: 1px solid var(--border-light);
        display: flex;
        flex-direction: column;
    }

    .sidebar-title {
        font-size: 1.25rem;
        font-weight: 600;
        color: var(--text-primary);
        padding: 1.5rem;
        border-bottom: 1px solid var(--border-light);
        text-align: center;
    }

    .user-list {
        list-style: none;
        flex: 1;
        overflow-y: auto;
    }

    .user-list-item {
        padding: 1rem 1.5rem;
        cursor: pointer;
        font-size: 1rem;
        color: var(--text-primary);
        border-bottom: 1px solid var(--border-light);
        transition: background 0.2s;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .user-list-item:hover {
        background: var(--message-bg);
    }

    .no-users {
        padding: 1rem;
        text-align: center;
        color: var(--text-secondary);
        font-size: 0.9rem;
    }

    .chat-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: var(--light-bg);
    }

    .chat-header {
        padding: 1.5rem 2rem;
        border-bottom: 1px solid var(--border-light);
        background: white;
        box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
    }

    .chat-header h3 {
        font-weight: 600;
        color: var(--text-primary);
    }

    .messages-container {
        flex: 1;
        padding: 1.5rem;
        overflow-y: auto;
        background: var(--message-bg);
        display: flex;
        flex-direction: column;
    }

    .empty-state {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .chat-bubble {
        max-width: 70%;
        padding: 0.75rem 1rem;
        margin-bottom: 1rem;
        border-radius: 0.75rem;
        display: flex;
        flex-direction: column;
        word-wrap: break-word;
        box-shadow: var(--shadow);
    }

    .chat-bubble.mine {
        background: var(--message-user-bg);
        color: var(--text-primary);
        align-self: flex-end;
        border-radius: 0.75rem 0.75rem 0 0.75rem;
    }

    .chat-bubble.theirs {
        background: var(--message-received-bg);
        color: var(--text-primary);
        align-self: flex-start;
        border-radius: 0.75rem 0.75rem 0.75rem 0;
    }

    .bubble-content .text {
        font-size: 0.9rem;
    }

    .bubble-content .timestamp {
        font-size: 0.65rem;
        color: var(--text-light);
        margin-top: 0.25rem;
        align-self: flex-end;
    }

    .chat-bubble.mine .timestamp {
        color: var(--text-secondary);
    }

    .chat-form {
        display: flex;
        padding: 1rem 2rem;
        background: white;
        border-top: 1px solid var(--border-light);
        gap: 1rem;
    }

    .message-input {
        flex: 1;
        padding: 0.75rem;
        border: 1px solid var(--border-light);
        border-radius: 1rem;
        font-size: 0.9rem;
        outline: none;
        transition: border-color 0.2s;
    }

    .message-input:focus {
        border-color: var(--primary);
    }

    .send-button {
        padding: 0.75rem 1.5rem;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 0.5rem;
        font-size: 0.9rem;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s;
    }

    .send-button:hover {
        background: var(--primary-light);
    }

    .hidden {
        display: none;
    }

    .navbar {
        background-color: var(--dark-bg);
        padding: 1rem;
        color: white;
        display: flex;
        align-items: center;
        gap: 1rem;
    }

    .navbar a, .navbar .logout-btn {
        color: white;
        text-decoration: none;
        font-size: 1rem;
        transition: color 0.2s;
    }

    .navbar a:hover, .navbar .logout-btn:hover {
        color: var(--primary-light);
        text-decoration: none;
    }

    .logout-btn {
        background: none;
        border: none;
        cursor: pointer;
        font: inherit;
    }
</style>

<script>
let chatSocket = null;
let currentChatId = null;

async function loadMessages(chatId) {
    const response = await fetch(`/chat/${chatId}/messages/`);
    const messages = await response.json();
    const feed = document.getElementById("chat-messages");
    feed.innerHTML = "";
    if (messages.length === 0) {
        feed.innerHTML = `
            <div class="empty-state">
                <p class="text-gray-500 text-lg">No messages yet.</p>
            </div>`;
    } else {
        messages.forEach(msg => {
            const div = document.createElement("div");
            const isMine = msg.sender__username === "{{ user.username|escapejs }}";
            div.className = "chat-bubble " + (isMine ? "mine" : "theirs");
            div.innerHTML = `
                <div class="bubble-content">
                    <span class="text">${msg.content}</span>
                    <span class="timestamp">${msg.timestamp}</span>
                </div>
            `;
            feed.appendChild(div);
        });
        feed.scrollTop = feed.scrollHeight;
    }
}

async function startChat(userId, username) {
    document.getElementById("chat-area").classList.remove("hidden");
    document.getElementById("chat-username").textContent = username;

    if (chatSocket) {
        chatSocket.close();
    }

    const response = await fetch(`/chat/get_or_create_chat/${userId}/`);
    const data = await response.json();
    currentChatId = data.chat_id;

    await loadMessages(currentChatId);

    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    chatSocket = new WebSocket(
    `${protocol}//${window.location.host}/ws/chat/${currentChatId}/`
);

    chatSocket.onmessage = function(e) {
        const data = JSON.parse(e.data);
        const feed = document.getElementById("chat-messages");
        const div = document.createElement("div");
        const isMine = data.user === "{{ user.username|escapejs }}";
        div.className = "chat-bubble " + (isMine ? "mine" : "theirs");
        div.innerHTML = `
            <div class="bubble-content">
                <span class="text">${data.message}</span>
                <span class="timestamp">${data.timestamp || ''}</span>
            </div>
        `;
        feed.appendChild(div);
        feed.scrollTop = feed.scrollHeight;
    };

    chatSocket.onclose = function() {
        console.error('Chat socket closed unexpectedly');
    };
}

document.getElementById("chat-form").addEventListener("submit", function(e) {
    e.preventDefault();
    const input = document.getElementById("message-input");
    const message = input.value.trim();

    if (!message) return;

    if (chatSocket && chatSocket.readyState === WebSocket.OPEN) {
        chatSocket.send(JSON.stringify({ "message": message }));
    } else {
        console.error("WebSocket is not connected");
    }

    input.value = "";
    input.focus();
});
</script>
{% endblock %}
