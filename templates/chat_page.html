{% extends "base.html" %}
{% block content %}
<h2>Start a Chat</h2>

<!-- Dropdown to pick a user -->
<label for="chat-user">Choose a user to chat with:</label>
<select id="chat-user">
    <option value="">-- Select a user --</option>
    {% for u in users %}
        {% if u != user %}
            <option value="{{ u.id }}">{{ u.username }}</option>
        {% endif %}
    {% endfor %}
</select>

<div id="chat-area" style="display:none; margin-top:20px;">
    <h3>Chat with <span id="chat-username"></span></h3>

    <!-- ✅ Show all previous messages -->
    <div class="chat-box messages" id="chat-messages" style="border:1px solid #ccc; height:300px; overflow-y:scroll; padding:10px;">
        {% for msg in messages %}
            <p><strong>{{ msg.sender.username }}:</strong> {{ msg.content }} <small>{{ msg.timestamp }}</small></p>
        {% empty %}
            <p>No messages yet.</p>
        {% endfor %}
    </div>

    <!-- ✅ Send new messages -->
    <form id="chat-form" style="margin-top:10px;">
        <input type="text" id="message-input" placeholder="Type a message..." style="width:80%;">
        <button type="submit">Send</button>
    </form>
</div>

<script>
    const token = localStorage.getItem('access_token') || sessionStorage.getItem('access_token');
    let chatSocket = null;
    let selectedUserId = null;

    // Handle user selection
    document.getElementById("chat-user").addEventListener("change", function() {
        selectedUserId = this.value;
        const selectedUsername = this.options[this.selectedIndex].text;

        if (selectedUserId) {
            document.getElementById("chat-area").style.display = "block";
            document.getElementById("chat-username").textContent = selectedUsername;

            // Close old socket if open
            if (chatSocket) {
                chatSocket.close();
            }

            // Open a new WebSocket connection
            chatSocket = new WebSocket(
                'ws://' + window.location.host + '/ws/chat/' + selectedUserId + '/?token=' + token
            );

            // Handle incoming messages
            chatSocket.onmessage = function(e) {
                const data = JSON.parse(e.data);
                const box = document.getElementById("chat-messages");
                const msgDiv = document.createElement("div");
                msgDiv.className = "message";
                msgDiv.innerHTML = `<strong>${data.user}:</strong> ${data.message}`;
                box.appendChild(msgDiv);
                box.scrollTop = box.scrollHeight;
            };

            chatSocket.onclose = function(e) {
                console.error('Chat socket closed unexpectedly');
            };
        } else {
            document.getElementById("chat-area").style.display = "none";
        }
    });

    // Handle form submission
    document.getElementById("chat-form").addEventListener("submit", function(e) {
        e.preventDefault();
        const input = document.getElementById("message-input");
        const message = input.value.trim();

        if (message && chatSocket && chatSocket.readyState === WebSocket.OPEN) {
            chatSocket.send(JSON.stringify({ "message": message }));
            input.value = "";
        }
    });
</script>
{% endblock %}
