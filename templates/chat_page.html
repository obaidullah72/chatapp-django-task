{% extends "base.html" %}
{% block content %}

<style>
.chat-bubble {
    max-width: 60%;
    padding: 8px 12px;
    margin: 5px;
    border-radius: 12px;
    display: inline-block;
    clear: both;
    word-wrap: break-word;
}

.chat-bubble.mine {
    background-color: #DCF8C6;   /* WhatsApp green */
    float: right;
    text-align: right;
}

.chat-bubble.theirs {
    background-color: #F1F0F0;   /* light gray */
    float: left;
    text-align: left;
}

.bubble-content {
    display: flex;
    flex-direction: column;
}

.bubble-content .text {
    font-size: 14px;
}

.bubble-content .timestamp {
    font-size: 10px;
    color: gray;
    margin-top: 3px;
    align-self: flex-end;
}
</style>

<h2>Start a Chat</h2>

<!-- List of all users -->
<div style="display:flex; gap:20px;">
    <div style="width:200px; border-right:1px solid #ccc; padding-right:10px;">
        <h4>Users</h4>
        <ul id="user-list" style="list-style:none; padding:0;">
            {% for u in users %}
                <li style="padding:5px; cursor:pointer; border-bottom:1px solid #eee;"
                    onclick="startChat({{ u.id }}, '{{ u.username }}')">
                    {{ u.username }}
                </li>
            {% endfor %}
        </ul>
    </div>

    <div id="chat-area" style="flex:1; display:none;">
        <h3>Chat with <span id="chat-username"></span></h3>

        <!-- Chat messages -->
        <div id="chat-messages"
             style="border:1px solid #ccc; height:300px; overflow-y:scroll; padding:10px;">
            <p style="color:gray;">Select a user to load messages...</p>
        </div>

        <!-- Send new messages -->
        <form id="chat-form" style="margin-top:10px;">
            <input type="text" id="message-input" placeholder="Type a message..." style="width:80%;">
            <button type="submit">Send</button>
        </form>
    </div>
</div>

<script>
let chatSocket = null;
let currentChatId = null;

// Load all messages for this chat
async function loadMessages(chatId) {
    const response = await fetch(`/chat/${chatId}/messages/`);
    const messages = await response.json();
    const feed = document.getElementById("chat-messages");
    feed.innerHTML = "";
    if (messages.length === 0) {
        feed.innerHTML = "<p style='color:gray;'>No messages yet.</p>";
    } else {
        messages.forEach(msg => {
            const div = document.createElement("div");
            const isMine = msg.sender__username === "{{ user.username }}";
            div.className = "chat-bubble " + (isMine ? "mine" : "theirs");
            div.innerHTML = `
                <div class="bubble-content">
                    <span class="text">${msg.content}</span>
                    <span class="timestamp">${msg.timestamp}</span>
                </div>
            `;
            feed.appendChild(div);
        });
        feed.scrollTop = feed.scrollHeight;
    }
}

// Start chat with a user
async function startChat(userId, username) {
    document.getElementById("chat-area").style.display = "block";
    document.getElementById("chat-username").textContent = username;

    if (chatSocket) {
        chatSocket.close();
    }

    // Ask backend to get or create chat
    const response = await fetch(`/chat/get_or_create_chat/${userId}/`);
    const data = await response.json();
    currentChatId = data.chat_id;

    // Load history
    await loadMessages(currentChatId);

    // ✅ Force WebSocket to Daphne port 8001
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    chatSocket = new WebSocket(
        `${protocol}//${window.location.hostname}:8001/ws/chat/${currentChatId}/`
    );

    // Receive messages live
    chatSocket.onmessage = function(e) {
        const data = JSON.parse(e.data);
        const feed = document.getElementById("chat-messages");
        const div = document.createElement("div");
        const isMine = data.user === "{{ user.username }}";
        div.className = "chat-bubble " + (isMine ? "mine" : "theirs");
        div.innerHTML = `
            <div class="bubble-content">
                <span class="text">${data.message}</span>
                <span class="timestamp">${data.timestamp || ''}</span>
            </div>
        `;
        feed.appendChild(div);
        feed.scrollTop = feed.scrollHeight;
    };

    chatSocket.onclose = function() {
        console.error('Chat socket closed unexpectedly');
    };
}

// Handle sending messages
document.getElementById("chat-form").addEventListener("submit", function(e) {
    e.preventDefault();
    const input = document.getElementById("message-input");
    const message = input.value.trim();

    if (!message) return;

    if (chatSocket && chatSocket.readyState === WebSocket.OPEN) {
        chatSocket.send(JSON.stringify({ "message": message }));
    } else {
        console.error("WebSocket is not connected");
    }

    input.value = "";
    input.focus();
});
</script>
{% endblock %}
