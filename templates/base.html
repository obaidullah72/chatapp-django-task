<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Application</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }
        .navbar {
            background-color: #343a40;
            padding: 1rem;
            color: white;
        }
        .navbar a {
            color: white;
            text-decoration: none;
            margin-right: 15px;
        }
        .navbar a:hover {
            text-decoration: underline;
        }
        .container {
            padding: 20px;
        }
    </style>
</head>
<body>
<nav class="navbar">
    <a href="{% url 'home' %}">Home</a>
    {% if user.is_authenticated %}
        <a href="{% url 'profile-page' %}">Profile</a>
        <a href="{% url 'chat-list-page' %}">Chat_list</a>
        
        <!-- Always show Chat button -->
        {% if chats %}
            <a href="{% url 'chat-page' chats.0.id %}">Chat</a>
        {% else %}
            <a href="{% url 'chat-list-page' %}">Chat</a>
        {% endif %}
        
        <a href="{% url 'logout' %}">Logout ({{ user.username }})</a>
    {% else %}
        <a href="{% url 'login' %}">Login</a>
    {% endif %}
</nav> 
    
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
