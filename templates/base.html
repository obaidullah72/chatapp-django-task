{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Application</title>
    <link rel="icon" href="{% static 'images/favicon.ico' %}" type="image/x-icon">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f5f5f5; }
        .navbar { background-color: #343a40; padding: 1rem; color: white; }
        .navbar a { color: white; text-decoration: none; margin-right: 15px; }
        .navbar a:hover { text-decoration: underline; }
        .container { padding: 20px; }
        .logout-btn { background: none; border: none; color: white; cursor: pointer; font: inherit; }
        .logout-btn:hover { text-decoration: underline; }
    </style>
</head>
<body>
<nav class="navbar">
    <a href="{% url 'home' %}">Home</a>
    {% if user.is_authenticated %}
        <a href="{% url 'profile-page' %}">Profile</a>
        <a href="{% url 'chat-lobby' %}">Start Chat</a>
        <a href="{% url 'chat-list-page' %}">Chat List</a>
        <form action="{% url 'logout' %}" method="post" style="display:inline;">
            {% csrf_token %}
            <button type="submit" class="logout-btn">
                Logout ({{ user.username }})
            </button>
        </form>
    {% else %}
        <a href="{% url 'login' %}">Login</a>
    {% endif %}
</nav>

<div class="container">
    {% block content %}{% endblock %}
</div>
</body>
</html>
